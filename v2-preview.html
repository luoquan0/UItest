<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111e">
  <meta name="description" content="清朗政务 2.0，面向政务办公场景的数字智能工作台设计预览。">
  <title>清朗政务 2.0 | Digital Intelligence</title>
  <link rel="stylesheet" href="./v2-preview.css">
  <script defer src="./v2-preview.js"></script>
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <div class="app-shell" id="app-shell">
    <aside class="primary-nav" id="primary-nav" aria-label="主导航">
      <div class="brand-block">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 36 36" fill="none"><path d="M18 3.5 32.5 12v12L18 32.5 3.5 24V12L18 3.5Z" stroke="currentColor" stroke-width="1.4"/><path d="M10 22.5 18 9l8 13.5M12.6 18.5h10.8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="18" r="2" fill="currentColor"/></svg>
        </div>
        <div class="brand-text"><strong>清朗政务</strong><span>DIGITAL INTELLIGENCE</span></div>
      </div>
      <div class="workspace-switch"><span class="workspace-icon" aria-hidden="true">◇</span><span class="workspace-text"><b>政务智能工作台</b><small>单位工作空间</small></span><span class="workspace-chev">⌄</span></div>
      <div class="nav-label">WORKSPACE</div>
      <nav id="nav-menu" class="menu"></nav>
      <div class="nav-spacer"></div>
      <div class="sidebar-footer">
        <div class="online-indicator"><span class="online-dot"></span><span class="online-label">系统体验模式</span><span class="online-arrow">↗</span></div>
        <p class="sidebar-note">DESIGN PREVIEW 2.0<br>交互模拟 · 不含真实业务数据</p>
      </div>
    </aside>
    <div class="main-stage">
      <header class="topbar">
        <div class="top-left">
          <button class="icon-btn collapse-btn" id="toggle-nav" aria-label="收起或展开导航" title="收起或展开导航"><span data-icon="panel"></span></button>
          <span class="top-divider"></span>
          <div class="breadcrumbs"><span>清朗政务</span><span class="breadcrumb-slash">/</span><strong id="current-page">AI 智能对话</strong></div>
          <span class="version-pill">V 2.0</span>
        </div>
        <div class="top-right">
          <button id="command-open" class="search-trigger" aria-label="打开全局搜索"><span data-icon="search"></span><span>搜索功能、对话或设置...</span><kbd>Ctrl K</kbd></button>
          <div class="top-status"><span class="online-dot"></span><span>演示环境</span></div>
          <button class="icon-btn" id="theme-toggle" aria-label="切换浅色深色主题" title="切换主题"><span data-icon="sunmoon"></span></button>
          <button class="icon-btn" id="notification" aria-label="通知" title="通知"><span data-icon="bell"></span><i class="notification-dot"></i></button>
          <button class="avatar-button" id="account-menu" aria-label="当前演示用户"><span>张</span></button>
        </div>
      </header>
      <main id="view" class="view-stage" tabindex="-1">
        <section class="initial-state">
          <div class="initial-spinner" aria-hidden="true"></div>
          <h1>清朗政务 · 智能工作空间</h1>
          <p>正在初始化设计预览。如果持续停留在此处，请刷新页面。</p>
        </section>
      </main>
      <div id="toast-container" class="toast-container" aria-live="polite"></div>
    </div>
  </div>
  <div id="overlay-root"></div>
  <noscript><div class="noscript">此交互预览需要启用 JavaScript。</div></noscript>
</body>
</html>
