<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{font-family:"Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;color-scheme:light;--navy:#1f418b;--blue:#2f6bff;--bg:#f4f7fc;--surface:#fff;--surface2:#f8faff;--line:#e5eaf2;--text:#1f2937;--muted:#64748b;--sidebar:#19376f;--shadow:0 2px 10px #172b4d0a}
[data-theme=dark]{color-scheme:dark;--bg:#111827;--surface:#1f2937;--surface2:#172235;--line:#334155;--text:#e5e7eb;--muted:#94a3b8;--sidebar:#17243a;--shadow:0 2px 10px #0002}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:226px;background:var(--sidebar);color:#eaf1ff;display:flex;flex-direction:column;flex-shrink:0;transition:.2s}.sidebar.collapsed{width:68px}.brand{height:66px;display:flex;align-items:center;gap:11px;padding:0 20px;border-bottom:1px solid #ffffff1a;font-weight:700;font-size:17px;white-space:nowrap}.brandmark{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:900}.nav{padding:16px 10px;display:grid;gap:5px}.nav button{border:0;background:transparent;color:#d9e5ff;text-align:left;padding:11px 13px;border-radius:8px;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:#ffffff20;color:#fff}.nav .ico{width:20px;text-align:center;font-size:16px}.sidefoot{margin-top:auto;padding:14px;border-top:1px solid #ffffff1a;color:#c4d3ef;font-size:12px}.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:66px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:15px}.top-left,.top-right{display:flex;align-items:center;gap:14px}.topbar button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:8px 10px}.workspace{color:var(--muted)}.user{display:flex;align-items:center;gap:8px}.avatar{width:30px;height:30px;border-radius:50%;background:#e3ecff;color:var(--navy);display:grid;place-items:center;font-weight:700}.content{padding:24px;max-width:1600px;width:100%;margin:0 auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:15px}.pagehead h1{font-size:22px;margin:0 0 6px}.sub{color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 13px;border-radius:8px}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.danger{color:#dc2626}.btn.small{padding:6px 9px;font-size:12px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:17px;box-shadow:var(--shadow);min-width:0}.statlabel{color:var(--muted);font-size:13px}.statvalue{font-size:25px;font-weight:700;margin:9px 0 4px}.positive{color:#16a34a;font-size:12px}.twocol{grid-template-columns:1.5fr 1fr}.sectiontitle{font-weight:700;margin:0 0 14px}.chatlayout{display:grid;grid-template-columns:230px minmax(350px,1fr) 250px;gap:14px;height:calc(100vh - 116px);min-height:620px}.chatlist,.context{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px;overflow:auto}.chatlist .btn{width:100%;margin-bottom:12px}.chatitem{padding:10px;border-radius:7px;cursor:pointer;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chatitem.active,.chatitem:hover{background:var(--surface2);color:var(--text)}.chatcenter{display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:11px;overflow:hidden}.chathead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.messages{padding:22px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:18px}.welcome{text-align:center;margin:auto;max-width:520px}.welcome h2{font-size:24px;margin:0 0 9px}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:24px}.suggestions button{padding:12px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;color:var(--text);text-align:left}.msg{max-width:88%;display:flex;gap:10px;align-items:flex-start}.msg.user{align-self:flex-end;flex-direction:row-reverse}.bubble{padding:12px 14px;border-radius:10px;background:var(--surface2);line-height:1.75;white-space:pre-wrap}.msg.user .bubble{background:#eaf1ff;color:#1e3a70}.composer{border-top:1px solid var(--line);padding:14px 18px}.composebox{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--surface)}.composebox textarea{flex:1;border:0;outline:0;resize:vertical;min-height:42px;max-height:120px;background:transparent;color:var(--text)}.hint{font-size:11px;color:var(--muted);margin-top:7px}.context .card{box-shadow:none;padding:12px;margin-bottom:12px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}input,select,textarea{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:7px;padding:9px;width:100%}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}th{background:var(--surface2);font-size:12px;color:var(--muted);font-weight:600}td{font-size:13px}.status{display:inline-block;border-radius:20px;padding:3px 8px;font-size:11px;background:#dcfce7;color:#15803d}.status.off{background:#f1f5f9;color:#64748b}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.toolbar input{max-width:260px}.bar{height:8px;background:var(--surface2);border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:20px}.listrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.modalback{position:fixed;inset:0;background:#0f172a80;display:grid;place-items:center;padding:20px;z-index:5}.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;width:min(480px,100%);box-shadow:0 18px 50px #0003}.modal h3{margin:0 0 16px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:24px;bottom:24px;background:#173b78;color:#fff;padding:12px 17px;border-radius:9px;z-index:8;box-shadow:0 8px 25px #0003}.empty{text-align:center;padding:42px;color:var(--muted)}.hidden{display:none!important}
@media(max-width:1100px){.chatlayout{grid-template-columns:190px minmax(300px,1fr)}.context{display:none}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.sidebar{width:66px}.sidebar .brand span,.sidebar .nav .label,.sidebar .sidefoot{display:none}.sidebar .brand{padding:0 18px}.nav button{justify-content:center;padding:12px 5px}.content{padding:15px}.topbar{padding:0 12px}.workspace{display:none}.chatlayout{display:flex;height:auto;min-height:calc(100vh - 100px)}.chatlist{display:none}.chatcenter{min-height:650px}.stats{grid-template-columns:1fr 1fr}.twocol{grid-template-columns:1fr}.pagehead{align-items:center}.pagehead h1{font-size:19px}}
</style></head>
<body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">清</div><span>清朗政务</span></div><nav class="nav" id="nav"></nav><div class="sidefoot">政务智能助手<br>演示环境 · 数据仅保存在本机</div></aside><main class="main"><header class="topbar"><div class="top-left"><button id="collapse">☰</button><span class="workspace">单位工作空间　⌄</span></div><div class="top-right"><button id="theme">☾ 深色</button><button id="notice">通知</button><div class="user"><div class="avatar">张</div><span>张三　⌄</span></div></div></header><div class="content" id="view"></div></main></div><div id="modalroot"></div><div id="toastroot"></div>
<script>
const pages=[["chat","◉","AI 对话"],["knowledge","▤","知识库"],["models","⬡","模型中心"],["apps","▦","应用管理"],["users","♙","用户与权限"],["api","⌘","API 管理"],["monitor","⌁","运行监控"],["settings","⚙","系统设置"],["audit","≡","审计日志"]];
const seed={sessions:[{id:1,title:"政策文件内容咨询",msgs:[["user","请帮我概括政务公开工作的主要要求。"],["ai","政务公开工作主要包括以下方面：\n\n一、主动公开。及时发布涉及公众利益、需要公众广泛知晓的政府信息。\n\n二、依申请公开。依法依规受理、审查和答复政府信息公开申请。\n\n三、规范管理。完善信息发布审核机制，确保内容准确、及时、合法。\n\n以上为演示回复，正式使用需接入实际模型与权威知识库。"]]} ,{id:2,title:"会议纪要整理",msgs:[]}],docs:[{name:"政务信息公开工作规范.pdf",kb:"政策法规知识库",type:"PDF",size:"2.1 MB",status:"已完成"},{name:"单位年度工作计划.docx",kb:"单位内部资料",type:"Word",size:"860 KB",status:"已完成"},{name:"办事服务指南.pdf",kb:"办事指南知识库",type:"PDF",size:"1.4 MB",status:"处理中"}],models:[{name:"Qwen3.8-27B",kind:"本地模型",provider:"llama.cpp",status:true,ctx:"128K",default:true},{name:"DeepSeek-R1",kind:"API 模型",provider:"OpenAI 兼容接口",status:true,ctx:"64K",default:false},{name:"通用问答模型",kind:"本地模型",provider:"Ollama",status:false,ctx:"32K",default:false}],users:[{name:"张三",dept:"办公室",role:"系统管理员",status:true},{name:"李四",dept:"业务科室",role:"业务人员",status:true},{name:"王五",dept:"综合科",role:"普通用户",status:true},{name:"赵六",dept:"办公室",role:"普通用户",status:false}],keys:[{name:"内部办公应用",key:"sk-demo-••••••••••91a2",scope:"对话、知识库",status:true},{name:"数据分析接口",key:"sk-demo-••••••••••72b4",scope:"数据分析",status:true}],apps:["智能问答","公文辅助","文件总结","文档分析","知识库问答","数据分析"]};
let db=JSON.parse(localStorage.getItem("qinglang-data")||"null")||seed;let page="chat",active=1,theme=localStorage.getItem("qinglang-theme")||"light",collapsed=false,showContext=true;
function save(){localStorage.setItem("qinglang-data",JSON.stringify(db))}
function toast(t){const n=document.getElementById("toastroot");n.innerHTML='<div class="toast">'+t+'</div>';setTimeout(()=>n.innerHTML="",2400)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function nav(){document.getElementById("nav").innerHTML=pages.map(([id,ic,label])=>'<button class="'+(page===id?"active":"")+'" data-page="'+id+'"><span class="ico">'+ic+'</span><span class="label">'+label+'</span></button>').join("");document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
function head(title,sub,actions=""){return '<div class="pagehead"><div><h1>'+title+'</h1><div class="sub">'+sub+'</div></div><div class="toolbar">'+actions+'</div></div>'}
function stat(label,value,desc){return '<div class="card"><div class="statlabel">'+label+'</div><div class="statvalue">'+value+'</div><div class="positive">'+desc+'</div></div>'}
function chat(){const s=db.sessions.find(x=>x.id===active)||db.sessions[0];return '<div class="chatlayout"><aside class="chatlist"><button class="btn primary" id="newchat">＋ 新建对话</button><input id="sessionsearch" placeholder="搜索历史会话"><p class="sub">最近对话</p><div id="sessionitems">'+db.sessions.map(x=>'<div class="chatitem '+(x.id===s.id?'active':'')+'" data-session="'+x.id+'">'+esc(x.title)+'</div>').join("")+'</div><div class="sub" style="margin-top:20px">个人空间 · 演示数据</div></aside><section class="chatcenter"><div class="chathead"><div><b>智能问答</b><div class="sub">面向单位内部办公场景的智能助手</div></div><select id="chatmodel" style="width:180px">'+db.models.map(m=>'<option '+(m.default?'selected':'')+'>'+esc(m.name)+'</option>').join("")+'</select></div><div class="messages" id="messages">'+(s.msgs.length?s.msgs.map(m=>'<div class="msg '+(m[0]==="user"?"user":"")+'"><div class="avatar">'+(m[0]==="user"?"张":"AI")+'</div><div class="bubble">'+esc(m[1])+'</div></div>').join(""):'<div class="welcome"><div class="brandmark" style="margin:auto;width:48px;height:48px;font-size:22px">清</div><h2>您好，我是政务智能助手</h2><div class="sub">可以协助您进行政策查询、材料整理、文档总结与日常办公</div><div class="suggestions"><button data-prompt="请帮我整理一份会议纪要模板">▤　会议纪要整理</button><button data-prompt="请概括政务信息公开的主要要求">▣　政策内容解读</button><button data-prompt="请帮我润色这段公文文字">✎　公文辅助写作</button><button data-prompt="请总结一份工作计划的重点">⌕　工作材料总结</button></div></div>')+'</div><div class="composer"><div class="composebox"><label class="btn small" for="fileinput">＋</label><input type="file" id="fileinput" class="hidden" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.txt"><textarea id="prompt" placeholder="请输入问题，或上传文件进行分析..."></textarea><button class="btn primary" id="send">发送 ↑</button></div><div class="hint" id="attachments">支持 PDF、Word、Excel、TXT · 演示环境不会上传文件到服务器</div></div></section><aside class="context"><h3 class="sectiontitle">对话设置</h3><div class="card"><b>当前模型</b><p class="sub">'+esc(db.models.find(m=>m.default)?.name||"未设置")+'</p><span class="status">可用（演示）</span></div><div class="card"><b>知识库引用</b><p class="sub">政策法规知识库</p><p class="sub">单位内部资料</p></div><div class="card"><b>生成参数</b><div class="field"><label>Temperature</label><input type="range" min="0" max="1" step=".1" value=".7"></div><div class="field"><label>最大输出 Token</label><select><option>4096</option><option>8192</option><option>16384</option></select></div></div><div class="sub">请勿输入国家秘密、工作秘密或个人敏感信息。</div></aside></div>'}
function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join("")+'</tr></thead><tbody>'+rows.join("")+'</tbody></table></div>'}
function knowledge(){return head("知识库管理","管理单位内部资料、政策文件及知识库文档",'<button class="btn primary" id="upload">＋ 上传文档</button><button class="btn" id="newkb">新建知识库</button>')+'<div class="grid stats">'+stat("知识库数量","3","正常运行") +stat("文档总数",db.docs.length,"持续更新") +stat("已处理文档",db.docs.filter(d=>d.status==="已完成").length,"处理完成") +stat("存储空间","128 MB","演示数据")+'</div><div class="toolbar"><input id="filter" placeholder="搜索文档名称或知识库"><select id="kbfilter"><option value="">全部知识库</option>'+[...new Set(db.docs.map(d=>d.kb))].map(k=>'<option>'+k+'</option>').join("")+'</select></div><div id="doctable">'+docsTable(db.docs)+'</div>'}
function docsTable(docs){return table(["文档名称","所属知识库","类型","文件大小","处理状态","操作"],docs.map((d,i)=>'<tr><td>▤ '+esc(d.name)+'</td><td>'+esc(d.kb)+'</td><td>'+d.type+'</td><td>'+d.size+'</td><td><span class="status '+(d.status==="已完成"?"":"off")+'">'+d.status+'</span></td><td><button class="btn small danger" data-del-doc="'+i+'">删除</button></td></tr>'))}
function models(){return head("模型中心","统一管理本地模型和兼容 API 的模型服务",'<button class="btn primary" id="addmodel">＋ 添加模型</button>')+'<div class="grid stats">'+stat("模型总数",db.models.length,"已登记") +stat("运行中",db.models.filter(m=>m.status).length,"可供调用") +stat("默认模型",db.models.find(m=>m.default)?.name||"未设置","当前默认") +stat("接入方式","本地 / API","兼容接口")+'</div>'+table(["模型名称","类型","服务提供方","上下文","状态","默认模型","操作"],db.models.map((m,i)=>'<tr><td><b>'+esc(m.name)+'</b></td><td>'+m.kind+'</td><td>'+esc(m.provider)+'</td><td>'+m.ctx+'</td><td><span class="status '+(m.status?"":"off")+'">'+(m.status?"运行中":"已停用")+'</span></td><td>'+(m.default?"是":"否")+'</td><td><button class="btn small" data-default="'+i+'">设为默认</button> <button class="btn small" data-toggle-model="'+i+'">'+(m.status?"停用":"启用")+'</button> <button class="btn small" data-edit-model="'+i+'">编辑</button></td></tr>'))}
function apps(){return head("应用管理","配置面向日常办公场景的 AI 应用入口",'<button class="btn primary" id="addapp">＋ 新建应用</button>')+'<div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">'+db.apps.map((a,i)=>'<div class="card"><div style="font-size:22px;color:var(--blue)">▣</div><h3>'+esc(a)+'</h3><p class="sub">为工作人员提供便捷的智能辅助能力。</p><button class="btn small" data-app="'+i+'">配置应用</button></div>').join("")+'</div>'}
function users(){return head("用户与权限","管理单位用户、部门及角色权限",'<button class="btn primary" id="adduser">＋ 新增用户</button>')+'<div class="toolbar"><input id="filter" placeholder="搜索姓名或部门"></div><div id="usertable">'+usersTable(db.users)+'</div>'}
function usersTable(rows){return table(["姓名","所属部门","角色","状态","操作"],rows.map((u,i)=>'<tr><td><b>'+esc(u.name)+'</b></td><td>'+esc(u.dept)+'</td><td>'+esc(u.role)+'</td><td><span class="status '+(u.status?"":"off")+'">'+(u.status?"正常":"已禁用")+'</span></td><td><button class="btn small" data-toggle-user="'+i+'">'+(u.status?"禁用":"启用")+'</button> <button class="btn small" data-edit-user="'+i+'">编辑</button></td></tr>'))}
function api(){return head("API 管理","管理平台接口密钥与调用权限",'<button class="btn primary" id="addkey">＋ 创建 API Key</button>')+'<div class="grid stats">'+stat("密钥总数",db.keys.length,"已登记") +stat("启用密钥",db.keys.filter(k=>k.status).length,"当前可用") +stat("今日调用","12,468","演示统计") +stat("调用成功率","99.8%","演示统计")+'</div>'+table(["名称","API Key","权限范围","状态","操作"],db.keys.map((k,i)=>'<tr><td>'+esc(k.name)+'</td><td>'+k.key+'</td><td>'+esc(k.scope)+'</td><td><span class="status '+(k.status?"":"off")+'">'+(k.status?"启用":"已停用")+'</span></td><td><button class="btn small" data-toggle-key="'+i+'">切换状态</button></td></tr>'))}
function monitor(){return head("运行监控","查看平台运行情况与资源使用概览",'<select id="period"><option>近 7 天</option><option>近 30 天</option></select>')+'<div class="grid stats">'+stat("今日对话量","1,286","↑ 12.6%") +stat("活跃用户","328","↑ 8.3%") +stat("Token 消耗","1,276 万","演示统计") +stat("模型响应时间","1.27 秒","运行正常")+'</div><div class="grid twocol"><div class="card"><h3 class="sectiontitle">对话调用趋势</h3><div style="height:190px;display:flex;align-items:end;gap:12px;padding:15px 5px;border-bottom:1px solid var(--line)">'+[34,48,43,66,58,78,86].map((v,i)=>'<div style="flex:1;text-align:center"><div style="height:'+v+'%;background:#4c83ed;border-radius:5px 5px 0 0"></div><small class="sub">'+(i+1)+'日</small></div>').join("")+'</div></div><div class="card"><h3 class="sectiontitle">服务状态</h3>'+["对话服务","模型服务","知识库服务","API 网关","文件服务"].map(x=>'<div class="listrow"><span>'+x+'</span><span class="status">正常运行</span></div>').join("")+'</div></div>'}
function settings(){return head("系统设置","管理平台基础配置、主题与安全策略")+'<div class="grid twocol"><div class="card"><h3 class="sectiontitle">基础设置</h3><div class="field"><label>系统名称</label><input value="清朗政务 · 政务智能助手"></div><div class="field"><label>工作空间名称</label><input value="单位工作空间"></div><div class="field"><label>默认模型</label><select>'+db.models.map(m=>'<option '+(m.default?"selected":"")+'>'+esc(m.name)+'</option>').join("")+'</select></div><button class="btn primary" id="savesettings">保存设置</button></div><div class="card"><h3 class="sectiontitle">外观与安全</h3><div class="listrow"><span>界面主题</span><button class="btn small" id="themesettings">切换浅色 / 深色</button></div><div class="listrow"><span>操作审计</span><span class="status">已启用（演示）</span></div><div class="listrow"><span>敏感信息提示</span><span class="status">已启用</span></div><div class="listrow"><span>数据存储</span><span class="sub">浏览器本地存储</span></div></div></div>'}
function audit(){return head("审计日志","查看管理操作记录（演示数据）")+'<div class="card"><div class="listrow"><span>2026-11-20 13:20　张三</span><span>登录演示工作空间</span><span class="status">成功</span></div><div class="listrow"><span>2026-11-20 13:18　张三</span><span>查看模型中心</span><span class="status">成功</span></div><div class="listrow"><span>2026-11-20 13:10　系统</span><span>知识库索引状态更新</span><span class="status">成功</span></div></div>'}
function render(){nav();document.documentElement.dataset.theme=theme;document.getElementById("theme").textContent=theme==="dark"?"☀ 浅色":"☾ 深色";const v=document.getElementById("view");v.innerHTML=({chat,knowledge,models,apps,users,api,monitor,settings,audit})[page]();bind()}
function modal(title,fields,onSave){const root=document.getElementById("modalroot");root.innerHTML='<div class="modalback"><div class="modal"><h3>'+title+'</h3>'+fields.map(f=>'<div class="field"><label>'+f.label+'</label><input id="mf-'+f.id+'" value="'+esc(f.value||"")+'" placeholder="'+esc(f.placeholder||"")+'"></div>').join("")+'<div class="modalactions"><button class="btn" id="cancel">取消</button><button class="btn primary" id="confirm">保存</button></div></div></div>';root.querySelector("#cancel").onclick=()=>root.innerHTML="";root.querySelector("#confirm").onclick=()=>{const o={};fields.forEach(f=>o[f.id]=root.querySelector("#mf-"+f.id).value.trim());if(fields.some(f=>f.required&&!o[f.id]))return toast("请填写必填内容");onSave(o);root.innerHTML="";save();render();toast("已保存")}}
function bind(){const $=id=>document.getElementById(id);if(page==="chat"){ $("newchat").onclick=()=>{const id=Date.now();db.sessions.unshift({id,title:"新建对话",msgs:[]});active=id;save();render()};document.querySelectorAll("[data-session]").forEach(n=>n.onclick=()=>{active=+n.dataset.session;render()});$("sessionsearch").oninput=e=>document.querySelectorAll("[data-session]").forEach(n=>n.classList.toggle("hidden",!db.sessions.find(s=>s.id===+n.dataset.session).title.includes(e.target.value)));document.querySelectorAll("[data-prompt]").forEach(b=>b.onclick=()=>{$("prompt").value=b.dataset.prompt;$("prompt").focus()});$("fileinput").onchange=e=>{$("attachments").textContent=[...e.target.files].map(f=>f.name+"（"+Math.round(f.size/1024)+" KB）").join("、")+" · 仅本地选择，未上传服务器"};$("send").onclick=send;$("prompt").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}}}
if(page==="knowledge"){ $("upload").onclick=()=>$("uploadfile").click();const f=document.createElement("input");f.type="file";f.multiple=true;f.accept=".pdf,.doc,.docx,.xls,.xlsx,.txt";f.id="uploadfile";f.className="hidden";document.body.appendChild(f);$("upload").onclick=()=>f.click();f.onchange=()=>{[...f.files].forEach(x=>db.docs.push({name:x.name,kb:"单位内部资料",type:x.name.split(".").pop().toUpperCase(),size:(x.size/1024/1024).toFixed(2)+" MB",status:"待处理"}));save();render();toast("文件信息已加入演示列表；尚未上传或解析")};$("newkb").onclick=()=>modal("新建知识库",[{id:"name",label:"知识库名称",required:true}],o=>{db.docs.push({name:"（空知识库）",kb:o.name,type:"—",size:"—",status:"待处理"})});$("filter").oninput=filterDocs;$("kbfilter").onchange=filterDocs;bindDocDelete();document.querySelectorAll("[data-del-doc]").forEach(b=>b.onclick=()=>{if(confirm("确定删除该文档记录？")){db.docs.splice(+b.dataset.delDoc,1);save();render()}})}
if(page==="models"){$("addmodel").onclick=()=>modal("添加模型",[{id:"name",label:"模型名称",required:true},{id:"kind",label:"模型类型",value:"本地模型"},{id:"provider",label:"服务提供方",value:"llama.cpp"},{id:"ctx",label:"上下文长度",value:"32K"}],o=>db.models.push({...o,status:false,default:false}));document.querySelectorAll("[data-default]").forEach(b=>b.onclick=()=>{db.models.forEach((m,i)=>m.default=i===+b.dataset.default);save();render();toast("默认模型已更新")});document.querySelectorAll("[data-toggle-model]").forEach(b=>b.onclick=()=>{db.models[+b.dataset.toggleModel].status=!db.models[+b.dataset.toggleModel].status;save();render()});document.querySelectorAll("[data-edit-model]").forEach(b=>b.onclick=()=>{const i=+b.dataset.editModel,m=db.models[i];modal("编辑模型",[{id:"name",label:"模型名称",value:m.name,required:true},{id:"provider",label:"服务提供方",value:m.provider},{id:"ctx",label:"上下文长度",value:m.ctx}],o=>Object.assign(m,o))})}
if(page==="apps"){$("addapp").onclick=()=>modal("新建应用",[{id:"name",label:"应用名称",required:true}],o=>db.apps.push(o.name));document.querySelectorAll("[data-app]").forEach(b=>b.onclick=()=>modal("配置应用",[{id:"name",label:"应用名称",value:db.apps[+b.dataset.app],required:true}],o=>db.apps[+b.dataset.app]=o.name))}
if(page==="users"){$("adduser").onclick=()=>modal("新增用户",[{id:"name",label:"姓名",required:true},{id:"dept",label:"所属部门",required:true},{id:"role",label:"角色",value:"普通用户"}],o=>db.users.push({...o,status:true}));$("filter").oninput=e=>{$("usertable").innerHTML=usersTable(db.users.filter(u=>(u.name+u.dept).includes(e.target.value)));bindUserActions()};bindUserActions()}
if(page==="api"){$("addkey").onclick=()=>modal("创建 API Key",[{id:"name",label:"密钥名称",required:true},{id:"scope",label:"权限范围",value:"对话"}],o=>db.keys.push({...o,key:"sk-demo-••••••••••"+Math.random().toString(16).slice(2,6),status:true}));document.querySelectorAll("[data-toggle-key]").forEach(b=>b.onclick=()=>{db.keys[+b.dataset.toggleKey].status=!db.keys[+b.dataset.toggleKey].status;save();render()})}
if(page==="settings"){$("themesettings").onclick=toggleTheme;$("savesettings").onclick=()=>toast("设置已保存（演示）")}
}
function bindUserActions(){document.querySelectorAll("[data-toggle-user]").forEach(b=>b.onclick=()=>{db.users[+b.dataset.toggleUser].status=!db.users[+b.dataset.toggleUser].status;save();render()});document.querySelectorAll("[data-edit-user]").forEach(b=>b.onclick=()=>{const i=+b.dataset.editUser,u=db.users[i];modal("编辑用户",[{id:"name",label:"姓名",value:u.name,required:true},{id:"dept",label:"所属部门",value:u.dept},{id:"role",label:"角色",value:u.role}],o=>Object.assign(u,o))})}
function filterDocs(){const q=$("filter").value,k=$("kbfilter").value; $("doctable").innerHTML=docsTable(db.docs.filter(d=>(d.name+d.kb).includes(q)&&(!k||d.kb===k)));bindDocDelete()}
function bindDocDelete(){document.querySelectorAll("[data-del-doc]").forEach(b=>b.onclick=()=>{if(confirm("确定删除该文档记录？")){db.docs.splice(+b.dataset.delDoc,1);save();render()}})}
function send(){const input=document.getElementById("prompt"),text=input.value.trim();if(!text)return;const s=db.sessions.find(x=>x.id===active);s.msgs.push(["user",text]);if(s.title==="新建对话")s.title=text.slice(0,18);input.value="";save();render();const area=document.getElementById("messages");const m=document.createElement("div");m.className="msg";m.innerHTML='<div class="avatar">AI</div><div class="bubble">正在生成回复…</div>';area.appendChild(m);area.scrollTop=area.scrollHeight;setTimeout(()=>{m.querySelector(".bubble").textContent="已收到您的问题。当前为前端交互演示环境，尚未连接真实模型服务。\n\n正式部署后，可通过模型中心接入 Ollama、llama.cpp、vLLM 或 OpenAI 兼容接口，并结合单位知识库提供有依据的回答。\n\n建议您核对相关政策原文及最新有效版本后再用于正式业务。";s.msgs.push(["ai",m.querySelector(".bubble").textContent]);save()},850)}
function toggleTheme(){theme=theme==="dark"?"light":"dark";localStorage.setItem("qinglang-theme",theme);render()}
$("collapse").onclick=()=>{$("sidebar").classList.toggle("collapsed")};$("theme").onclick=toggleTheme;$("notice").onclick=()=>toast("暂无新通知");render();
</script></body></html>
