name: Deploy Gulangyu tourism website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate website assets
        run: |
          node --check site.js
          test -s index.html
          test -s site.css
          test -s site.js
          grep -q "GULANGYU" index.html
          grep -q 'id="spots"' index.html
          grep -q 'id="gallery"' index.html
          grep -q 'id="island-story"' index.html
          grep -q 'id="hero-particles"' index.html
          grep -q 'data-story-image' index.html
      - name: Smoke-test rendered homepage
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$CHROME" ]; then
            python3 -m http.server 9080 >/tmp/gulangyu-server.log 2>&1 &
            SERVER_PID=$!
            trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
            sleep 2
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --virtual-time-budget=2500 --dump-dom \
              "http://127.0.0.1:9080/" > /tmp/gulangyu-dom.html 2>/tmp/chrome-stderr.log
            grep -q "鼓浪屿" /tmp/gulangyu-dom.html
            grep -q "必游景点" /tmp/gulangyu-dom.html
            grep -q "游客服务" /tmp/gulangyu-dom.html
            grep -q "CHAPTER 01" /tmp/gulangyu-dom.html
            echo "Gulangyu homepage rendered with core sections."
          else
            echo "Headless Chrome unavailable; static syntax validation passed."
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
