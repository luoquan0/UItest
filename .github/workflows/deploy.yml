name: Deploy Gulangyu tourism website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate offline notice
        run: |
          test -s index.html
          grep -q "网站已暂停访问" index.html
          grep -q "noindex,nofollow" index.html
      - name: Smoke-test offline notice
        run: |
          python3 -m http.server 9080 >/tmp/offline-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          curl -fsS http://127.0.0.1:9080/ > /tmp/offline-page.html
          grep -q "网站已暂停访问" /tmp/offline-page.html
          echo "Offline notice is served as the public homepage."
      - name: Upload visual QA screenshot
        uses: actions/upload-artifact@v4
        with:
          name: gulangyu-visual-qa
          path: |
            ${{ runner.temp }}/gulangyu-homepage.png
            ${{ runner.temp }}/gulangyu-dom.html
          if-no-files-found: warn
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
